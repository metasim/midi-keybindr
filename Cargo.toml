[package]
name = "midi-mapper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
enigo = "0.2"
glob = "0.3"
keybinds = { version = "0.0.7", features = ["serde"] }
midir = "0.10"
midly = "0.5"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yaml_serde = "0.10"
