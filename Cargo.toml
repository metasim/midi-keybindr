[package]
name = "midi-keybindr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
enigo = "0.6"
glob = "0.3"
keybinds = { version = "0.2", features = ["serde"] }
midir = "0.11"
midly = "0.5"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
yaml_serde = "0.10"

[dev-dependencies]
insta = "1"
tempfile = "3"
